{% extends 'base.html' %}
{% load crispy_forms_tags %}
{% block content %}
<div class="col-md-4 mx-auto mt-5">
  <div class="card shadow">
    <div class="card-body">
      <h3 class="text-center mb-4">Iniciar Sesión</h3>
      <form method="post">
        {% csrf_token %}
        {{ form|crispy }}
        <button type="submit" class="btn btn-primary w-100 mt-3">Ingresar</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
