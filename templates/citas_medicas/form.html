{% extends 'base.html' %}
{% load crispy_forms_tags %}
{% block content %}
<div class="col-md-8 mx-auto mt-4">
    <div class="card shadow">
        <div class="card-body">
            <h2 class="mb-4">{{ titulo }}</h2>
            <form method="post">
                {% csrf_token %}
                {{ form|crispy }}
                <button type="submit" class="btn btn-success mt-3">Guardar</button>
                <a href="{% url 'citas_medicas:agenda' %}" class="btn btn-secondary mt-3">Cancelar</a>
            </form>
        </div>
    </div>
</div>
{% endblock %}
